<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-Do List | Thiranex</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="container">
      <h1>My To-Do List</h1>
    </div>
  </header>

  <main id="main-content">
    <section>
      <div class="container">

        <h2>Task Manager</h2>

        <div class="form-group">
          <label for="taskInput">Enter a task</label>

          <input
            id="taskInput"
            type="text"
            placeholder="Enter your task"
          >

          <button id="addTaskBtn" type="button">
            Add Task
          </button>
        </div>

        <div class="filters">
          <button
            class="filter-btn active"
            data-filter="all"
            type="button">
            All
          </button>

          <button
            class="filter-btn"
            data-filter="active"
            type="button">
            Active
          </button>

          <button
            class="filter-btn"
            data-filter="completed"
            type="button">
            Completed
          </button>
        </div>

        <ul id="taskList"></ul>

      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Thiranex JavaScript Task</p>
    </div>
  </footer>

  <script src="script.js"></script>

</body>
</html>
